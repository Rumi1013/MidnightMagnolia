name: CI

on:
  push:
    branches: [feature/magnolia-illustration-library, main]
  pull_request:
    branches: [feature/magnolia-illustration-library, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint --dir pages --dir components --dir lib || true

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.midnight-magnolia.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          WIX_CLIENT_ID: placeholder
          WIX_ACCESS_TOKEN: placeholder
          AIRTABLE_API_KEY: placeholder
          AIRTABLE_BASE_ID: placeholder
          NOTION_API_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build
